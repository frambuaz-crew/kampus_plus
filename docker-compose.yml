# KAMPÜS+ - Ekip ortamı: Backend + Frontend + PostgreSQL
# 5 kişi aynı docker-compose ile çalışır; ortak image için TECH_STACK.md'ye bakın.

services:
  # PostgreSQL - Ekip veritabanı
  postgres:
    image: postgres:15-alpine
    container_name: kampus-postgres
    environment:
      POSTGRES_USER: kampus
      POSTGRES_PASSWORD: kampus
      POSTGRES_DB: kampus_plus
    ports:
