services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kampus-postgres
    environment:
      POSTGRES_DB: kampus_plus
      POSTGRES_USER: kampus_user
      POSTGRES_PASSWORD: kampus_dev_password_2024
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"  # Using 5433 on host since 5432 is already in use
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus_user -d kampus_plus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kampus-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kampus-backend
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data/vectors:/app/data/vectors
    networks:
      - kampus-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # ClamAV Antivirus (for malware scanning)
  clamav:
    image: clamav/clamav:latest
    container_name: kampus-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s  # ClamAV needs time to download virus definitions
    networks:
      - kampus-network

  # Frontend (will be added later)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: kampus-frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - kampus-network

volumes:
  postgres_data:
    driver: local
  clamav_data:
    driver: local

networks:
  kampus-network:
    driver: bridge
