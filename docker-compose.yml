version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kampus-postgres
    environment:
      POSTGRES_DB: kampus_plus
      POSTGRES_USER: kampus_user
      POSTGRES_PASSWORD: kampus_dev_password_2024
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"  # Using 5433 on host since 5432 is already in use
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus_user -d kampus_plus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kampus-network

  # Backend API (will be added later)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: kampus-backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     - DATABASE_URL=postgresql://kampus_user:kampus_dev_password_2024@postgres:5432/kampus_plus
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   networks:
  #     - kampus-network

  # Frontend (will be added later)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: kampus-frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - kampus-network

volumes:
  postgres_data:
    driver: local

networks:
  kampus-network:
    driver: bridge
