version: '3.9'

services:
  # ============================================================================
  # Backend API (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kampus-backend
    env_file:
      - ./backend/.env
    environment:
      # SQLite kullanıyoruz (PostgreSQL yerine basitlik için)
      - DATABASE_URL=sqlite+aiosqlite:///./kampus_plus.db
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      # Source code - hot reload için
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic:ro
      # Data - bind mount for vector metadata access
      - ./backend/data:/app/data
      # DB - persist edilmeli
      - backend_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kampus-network
    restart: unless-stopped
    command: >
      sh -c "
        echo '🚀 Starting Kampus+ Backend...' &&
        python -m alembic upgrade head &&
        python scripts/seed_data.py &&
        python scripts/populate_vectors.py &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ============================================================================
  # Frontend (React + Vite)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: kampus-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000/v1
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      # Source code - hot reload için
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      # node_modules'u container'da tut (hız için)
      - frontend_node_modules:/app/node_modules
    networks:
      - kampus-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

# ============================================================================
# Volumes (Data Persistence)
# ============================================================================
volumes:
  backend_db:
    driver: local
  frontend_node_modules:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  kampus-network:
    driver: bridge
