    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kampus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus_plus || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kampus_plus-backend:latest
    container_name: kampus-backend
    env_file:
      - ./backend/.env
    environment:
      # PostgreSQL - postgres servisine bağlan (Docker ağı)
      - DATABASE_URL=postgresql+asyncpg://kampus:kampus@postgres:5432/kampus_plus
      - ENVIRONMENT=development
      - DEBUG=true
      - FRONTEND_URL=http://localhost:5173
      - AI_DOCS_DIR=/app/data/raw_docs
      - VECTOR_EAGER_INIT=false
      - RUN_DB_MIGRATIONS=true
      - RUN_BOOTSTRAP_TASKS=true
      - RUN_VECTOR_SEED=true
      - RUN_DOCS_INGEST=true
      - UVICORN_RELOAD=false
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/static:/app/static
      # Veri klasörleri — her biri ayrı ayrı mount
      - ./backend/data/raw_docs:/app/data/raw_docs          # Ingest edilecek PDF/TXT
      - ./backend/data/universities.json:/app/data/universities.json  # Seed kaynağı
      - vectors_data:/app/data/vectors                      # FAISS index (named volume)
      - ./backend/uploads:/app/uploads                      # Kullanıcı dosyaları (host bind)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kampus-network
    restart: unless-stopped
