# KAMPÜS+ - Ekip ortamı: Backend + Frontend + Local PostgreSQL
# Veritabani baglantisi backend/.env icinden db servisine yonlendirilir.

services:
  # PostgreSQL Database (Local Docker)
  db:
    image: postgres:15-alpine
    container_name: kampus-db
    environment:
      - POSTGRES_USER=kampus
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kampus_plus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus_plus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kampus-network
    restart: unless-stopped

  # Redis (Rate Limiting - SlowAPI)
  redis:
    image: redis:7-alpine
    container_name: kampus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kampus-network
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kampus_plus-backend:latest
    container_name: kampus-backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kampus-network
    restart: unless-stopped
    command: ["bash", "scripts/start_dev.sh"]

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    image: kampus_plus-frontend:latest
    container_name: kampus-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8001/api/v1
      - NODE_ENV=development
    ports:
      - "5174:5173"
    volumes:
      # Hot reload için source code mount
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # node_modules container'da kalır (performans)
      - frontend_node_modules:/app/node_modules
    networks:
      - kampus-network
    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

# Mailhog - Yerel Email Test Sunucusu
  mailhog:
    image: mailhog/mailhog
    container_name: kampus-mailhog
    ports:
      - "1025:1025" # SMTP Portu
      - "8025:8025" # Web Arayüzü (Emailleri buradan göreceğiz)
    networks:
      - kampus-network
    restart: unless-stopped

# Volumes (Veri kalıcılığı)
volumes:
  frontend_node_modules:
    driver: local
  postgres_data:
    driver: local

# Networks
networks:
  kampus-network:
    driver: bridge