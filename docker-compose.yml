services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kampus-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./kampus_plus.db
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      # Hot reload için source code mount
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      # Vector store ve uploads için data mount
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      # Veritabanı persistence
      - backend_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kampus-network
    restart: unless-stopped
    command: >
      sh -c "
        echo '🚀 Starting KAMPÜS+ Backend...' &&
        python -m alembic upgrade head || echo '⚠️  Migration hatası (devam ediliyor)' &&
        python scripts/seed_data.py || echo '⚠️  Seed hatası (devam ediliyor)' &&
        python scripts/populate_vectors.py || echo '⚠️  Vector populate hatası (devam ediliyor)' &&
        echo '✅ Starting FastAPI server...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: kampus-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Tarayıcıdan erişim için localhost kullanılır (Docker port mapping sayesinde)
      - VITE_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      # Hot reload için source code mount
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      # node_modules container'da kalır (performans)
      - frontend_node_modules:/app/node_modules
    networks:
      - kampus-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

# Volumes (Veri kalıcılığı)
volumes:
  backend_db:
    driver: local
  frontend_node_modules:
    driver: local

# Networks
networks:
  kampus-network:
    driver: bridge
