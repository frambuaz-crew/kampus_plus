openapi: 3.0.3
info:
  title: KAMPÜS+ AI Platform API
  description: |
    RESTful API for KAMPÜS+ - AI-Powered Hybrid Intelligence Platform for Universities.
    
    **Features:**
    - JWT-based authentication with university email
    - AI chatbot with hybrid RAG (official + user content)
    - PDF upload and vectorization for personal knowledge base
    - Anonymous student forum with moderation
    - Instructor analytics dashboard
    - Automatic official data synchronization
    
    **Security:** All endpoints (except auth) require JWT Bearer token.
  version: 1.0.0
  contact:
    name: KAMPÜS+ Team
    email: support@kampusplus.edu.tr

servers:
  - url: https://api.kampusplus.edu.tr/v1
    description: Production server
  - url: https://staging-api.kampusplus.edu.tr/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Local development server

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Chat
    description: AI chatbot interactions
  - name: Documents
    description: PDF upload and management
  - name: Forum
    description: Anonymous student forum
  - name: Courses
    description: Course information and enrollment
  - name: Sync
    description: Official data synchronization (admin only)
  - name: Instructor
    description: Instructor panel and analytics
  - name: Health
    description: System health and monitoring

paths:
  # ============================================================================
  # AUTHENTICATION ENDPOINTS
  # ============================================================================
  
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create new student or instructor account with university email
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate with email and password, receive JWT tokens
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: Refresh token httpOnly cookie
              schema:
                type: string
                example: refresh_token=abc123; HttpOnly; Secure; SameSite=Strict
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Email not verified or account inactive
  
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Get new access token using refresh token from cookie
      operationId: refreshToken
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Revoke refresh token and clear cookie
      operationId: logoutUser
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify email address
      description: Verify email using token from verification email
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Email verification token from link
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
  
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: Send password reset email to user
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent (always returns 200 to prevent email enumeration)
  
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: Set new password using reset token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token
  
  # ============================================================================
  # CHAT ENDPOINTS
  # ============================================================================
  
  /chat/sessions:
    get:
      tags: [Chat]
      summary: List chat sessions
      description: Get all conversation sessions for authenticated user
      operationId: listChatSessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Chat sessions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSession'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags: [Chat]
      summary: Create new chat session
      description: Start new conversation with AI assistant
      operationId: createChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /chat/sessions/{session_id}:
    get:
      tags: [Chat]
      summary: Get chat session
      description: Retrieve specific session with message history
      operationId: getChatSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags: [Chat]
      summary: Delete chat session
      description: Delete conversation session and all messages
      operationId: deleteChatSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /chat/sessions/{session_id}/messages:
    post:
      tags: [Chat]
      summary: Send chat message
      description: Send message to AI assistant and receive response
      operationId: sendChatMessage
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: AI response received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  
  # ============================================================================
  # DOCUMENT ENDPOINTS
  # ============================================================================
  
  /documents:
    get:
      tags: [Documents]
      summary: List user documents
      description: Get all documents uploaded by authenticated user
      operationId: listDocuments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Documents retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDocument'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags: [Documents]
      summary: Upload document
      description: Upload PDF for processing and vectorization
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file (max 25MB)
      responses:
        '202':
          description: Document accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          description: Invalid file (wrong type, too large, corrupted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large (>25MB)
  
  /documents/{document_id}:
    get:
      tags: [Documents]
      summary: Get document details
      description: Retrieve document metadata and processing status
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags: [Documents]
      summary: Delete document
      description: Delete document from S3 and remove vectors from FAISS
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Document deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /documents/{document_id}/download:
    get:
      tags: [Documents]
      summary: Download document
      description: Get pre-signed URL for document download
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Pre-signed URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    format: uri
                    description: Pre-signed S3 URL (expires in 15 minutes)
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  # ============================================================================
  # FORUM ENDPOINTS
  # ============================================================================
  
  /forum/threads:
    get:
      tags: [Forum]
      summary: List forum threads
      description: Get all root forum posts (threads)
      operationId: listForumThreads
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular, unanswered]
            default: recent
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Threads retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumThread'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags: [Forum]
      summary: Create forum thread
      description: Create new anonymous forum thread
      operationId: createForumThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumThread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  
  /forum/threads/{thread_id}:
    get:
      tags: [Forum]
      summary: Get forum thread
      description: Retrieve thread with all replies
      operationId: getForumThread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: Thread retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumThreadDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /forum/threads/{thread_id}/replies:
    post:
      tags: [Forum]
      summary: Reply to thread
      description: Post anonymous reply to forum thread
      operationId: replyToThread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 10
                  maxLength: 10000
      responses:
        '201':
          description: Reply posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  
  /forum/posts/{post_id}/flag:
    post:
      tags: [Forum]
      summary: Flag post
      description: Flag post for moderation review
      operationId: flagForumPost
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, harassment, inappropriate, other]
                details:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Post flagged successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /forum/search:
    get:
      tags: [Forum]
      summary: Search forum
      description: Search forum posts by keywords
      operationId: searchForum
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForumSearchResult'
                  total:
                    type: integer
        '400':
          description: Query too short
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  # ============================================================================
  # COURSE ENDPOINTS
  # ============================================================================
  
  /courses:
    get:
      tags: [Courses]
      summary: List courses
      description: Get all available courses
      operationId: listCourses
      parameters:
        - name: semester
          in: query
          schema:
            type: string
            example: "2024-Fall"
        - name: department
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Courses retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /courses/{course_id}:
    get:
      tags: [Courses]
      summary: Get course details
      description: Retrieve course information and schedule
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /courses/my-courses:
    get:
      tags: [Courses]
      summary: Get my enrolled courses
      description: Get courses user is enrolled in or teaching
      operationId: getMyCourses
      responses:
        '200':
          description: Enrolled courses retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  # ============================================================================
  # SYNC ENDPOINTS (ADMIN ONLY)
  # ============================================================================
  
  /sync/jobs:
    get:
      tags: [Sync]
      summary: List sync jobs
      description: Get all data synchronization jobs (admin only)
      operationId: listSyncJobs
      security:
        - BearerAuth: [admin]
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [uzem, announcement, schedule]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Sync jobs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncJob'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    
    post:
      tags: [Sync]
      summary: Trigger sync job
      description: Manually trigger data synchronization (admin only)
      operationId: triggerSync
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_system]
              properties:
                source_system:
                  type: string
                  enum: [uzem, announcement, schedule]
      responses:
        '202':
          description: Sync job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  
  /sync/jobs/{job_id}:
    get:
      tags: [Sync]
      summary: Get sync job details
      description: Retrieve sync job status and logs (admin only)
      operationId: getSyncJob
      security:
        - BearerAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  
  # ============================================================================
  # INSTRUCTOR ENDPOINTS
  # ============================================================================
  
  /instructor/dashboard:
    get:
      tags: [Instructor]
      summary: Get instructor dashboard
      description: Retrieve instructor analytics and course overview
      operationId: getInstructorDashboard
      security:
        - BearerAuth: [instructor]
      responses:
        '200':
          description: Dashboard data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  
  /instructor/courses/{course_id}/analytics:
    get:
      tags: [Instructor]
      summary: Get course analytics
      description: Retrieve anonymized student engagement analytics for course
      operationId: getCourseAnalytics
      security:
        - BearerAuth: [instructor]
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, semester]
            default: week
      responses:
        '200':
          description: Analytics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /instructor/courses/{course_id}/documents:
    post:
      tags: [Instructor]
      summary: Upload course material
      description: Upload supplementary course document for students
      operationId: uploadCourseMaterial
      security:
        - BearerAuth: [instructor]
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Course material uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  
  # ============================================================================
  # HEALTH ENDPOINTS
  # ============================================================================
  
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Check overall system health
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Check if system is ready to accept traffic
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: System ready
        '503':
          description: System not ready
  
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      description: Check if system is alive (for container orchestration)
      operationId: livenessCheck
      security: []
      responses:
        '200':
          description: System alive
        '503':
          description: System dead

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login
  
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    CourseId:
      name: course_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  
  schemas:
    # Auth Schemas
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, role]
      properties:
        email:
          type: string
          format: email
          example: student@university.edu.tr
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
          minLength: 2
          maxLength: 100
        last_name:
          type: string
          minLength: 2
          maxLength: 100
        role:
          type: string
          enum: [student, instructor]
        student_id:
          type: string
          example: "202112345"
    
    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        message:
          type: string
          example: "Verification email sent to student@university.edu.tr"
    
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (expires in 15 minutes)
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Token expiration in seconds
          example: 900
        user:
          $ref: '#/components/schemas/User'
    
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
    
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, instructor, admin]
        student_id:
          type: string
          nullable: true
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    
    # Chat Schemas
    ConversationSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        message_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    ConversationSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ConversationSession'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'
    
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          nullable: true
        created_at:
          type: string
          format: date-time
    
    ChatMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: User query (will be anonymized before LLM processing)
    
    ChatMessageResponse:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        response_time_ms:
          type: integer
    
    Source:
      type: object
      properties:
        type:
          type: string
          enum: [official, user, forum]
        id:
          type: string
          format: uuid
        title:
          type: string
        excerpt:
          type: string
        relevance:
          type: number
          format: float
          minimum: 0
          maximum: 1
    
    # Document Schemas
    UserDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        file_size:
          type: integer
          description: File size in bytes
        processing_status:
          type: string
          enum: [pending, processing, completed, failed]
        uploaded_at:
          type: string
          format: date-time
    
    UserDocumentDetail:
      allOf:
        - $ref: '#/components/schemas/UserDocument'
        - type: object
          properties:
            page_count:
              type: integer
              nullable: true
            chunk_count:
              type: integer
              nullable: true
            processed_at:
              type: string
              format: date-time
              nullable: true
            error_message:
              type: string
              nullable: true
    
    OfficialDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_system:
          type: string
          enum: [uzem, announcement, schedule]
        title:
          type: string
        document_type:
          type: string
        course_id:
          type: string
          format: uuid
          nullable: true
        publication_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    
    # Forum Schemas
    ForumThread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        anonymous_id:
          type: string
          example: "Anonim_a1b2c3d4e5f6"
        reply_count:
          type: integer
        upvote_count:
          type: integer
        created_at:
          type: string
          format: date-time
    
    ForumThreadDetail:
      allOf:
        - $ref: '#/components/schemas/ForumThread'
        - type: object
          properties:
            replies:
              type: array
              items:
                $ref: '#/components/schemas/ForumPost'
    
    ForumPost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        anonymous_id:
          type: string
        upvote_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    CreateThreadRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 500
        content:
          type: string
          minLength: 10
          maxLength: 10000
    
    ForumSearchResult:
      type: object
      properties:
        post_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        excerpt:
          type: string
        relevance:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
    
    # Course Schemas
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "CS101"
        name:
          type: string
        department:
          type: string
        semester:
          type: string
          example: "2024-Fall"
        credits:
          type: integer
        instructor_name:
          type: string
    
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            description:
              type: string
            schedule:
              type: object
              additionalProperties: true
            syllabus_url:
              type: string
              format: uri
              nullable: true
            enrollment_count:
              type: integer
    
    # Sync Schemas
    SyncJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_system:
          type: string
          enum: [uzem, announcement, schedule]
        status:
          type: string
          enum: [pending, running, completed, failed]
        documents_synced:
          type: integer
        documents_added:
          type: integer
        documents_updated:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    
    SyncJobDetail:
      allOf:
        - $ref: '#/components/schemas/SyncJob'
        - type: object
          properties:
            error_message:
              type: string
              nullable: true
            retry_count:
              type: integer
            logs:
              type: array
              items:
                type: string
    
    # Instructor Schemas
    InstructorDashboard:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        total_students:
          type: integer
        total_queries_week:
          type: integer
        top_topics:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              query_count:
                type: integer
    
    CourseAnalytics:
      type: object
      properties:
        course_id:
          type: string
          format: uuid
        period:
          type: string
        total_queries:
          type: integer
        unique_students:
          type: integer
          description: Anonymized count
        common_questions:
          type: array
          items:
            type: object
            properties:
              question_pattern:
                type: string
                description: Generalized question pattern (no PII)
              frequency:
                type: integer
        engagement_by_day:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              query_count:
                type: integer
    
    # Health Schemas
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: string
              enum: [up, down]
            faiss_official:
              type: string
              enum: [up, down]
            faiss_user:
              type: string
              enum: [up, down]
            s3:
              type: string
              enum: [up, down]
            openai:
              type: string
              enum: [up, down]
    
    # Error Schemas
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              nullable: true
  
  responses:
    BadRequest:
      description: Bad request (validation failed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Invalid request parameters"
              details:
                field: "email"
                issue: "Invalid email format"
    
    Unauthorized:
      description: Unauthorized (missing or invalid token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Authentication required"
    
    Forbidden:
      description: Forbidden (insufficient permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "FORBIDDEN"
              message: "Insufficient permissions"
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "NOT_FOUND"
              message: "Resource not found"
    
    Conflict:
      description: Conflict (resource already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "CONFLICT"
              message: "Email already registered"
    
    TooManyRequests:
      description: Too many requests (rate limit exceeded)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "RATE_LIMIT_EXCEEDED"
              message: "Too many requests, please try again later"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets

security:
  - BearerAuth: []
