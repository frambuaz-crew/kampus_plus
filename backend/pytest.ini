[pytest]
# Pytest Configuration for KAMPÜS+ Backend
# Task: T017 - Set up pytest configuration with coverage settings (80% target), async test support

# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async Test Support
asyncio_mode = auto

# Markers (for categorizing tests)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require database/external services)
    contract: API contract tests (OpenAPI validation)
    slow: Slow running tests
    requires_db: Tests that require database connection
    requires_s3: Tests that require S3 access
    requires_openai: Tests that require OpenAI API

# Coverage Settings (80% target per constitutional requirement)
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */alembic/*
    setup.py
    */conftest.py

[coverage:report]
# Coverage report settings
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Coverage thresholds (80% minimum per constitutional requirement)
fail_under = 80

[coverage:html]
directory = coverage_html

# Output Options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    -W ignore::DeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::UserWarning

# Timeout (prevent hanging tests - requires pytest-timeout)
# timeout = 300
# timeout_method = thread

