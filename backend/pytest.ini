[pytest]
# Pytest yapılandırması - KAMPÜS+ Backend

# Test keşfi
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test desteği
asyncio_mode = auto

# Marker'lar (test kategorileri)
markers =
    unit: Unit testler (hızlı, izole)
    integration: Integration testler (veritabanı/harici servisler gerekir)
    contract: API contract testleri (OpenAPI doğrulama)

# Coverage ayarları
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */alembic/*
    setup.py
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

fail_under = 80

[coverage:html]
directory = coverage_html

# Çıktı seçenekleri
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=80
    -W ignore::DeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Uyarılar
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::UserWarning

